name: NeonScope smoke checks
on:
  push:
    paths:
      - 'index.html'
      - '*.js'
      - '*.css'
      - '*.webmanifest'
      - 'test-smoke.cjs'
      - '.github/workflows/smoke.yml'
  pull_request:
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check syntax, UI element references and offline assets
        run: node test-smoke.cjs
      - name: Install Playwright browser runner
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Test real UI playback and animation in Chromium
        run: node test-browser.cjs
