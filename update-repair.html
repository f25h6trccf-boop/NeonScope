<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NeonScope · Update Repair</title><meta http-equiv="Cache-Control" content="no-store"><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#08101b;color:#efffff;font:16px system-ui}main{max-width:440px;padding:30px}button{padding:15px 20px;border:0;border-radius:12px;background:#8fffd0;color:#082018;font-weight:800;font-size:16px}p{line-height:1.6;color:#bad0d9}</style></head><body><main><h1>NeonScope Update Repair</h1><p id="status">Ready to remove outdated app caches. Your artwork and saved presets will remain untouched.</p><button id="reset">Clear old app cache and open latest version</button><p><small>If the page still says Version 30 afterward, the published GitHub Pages site is behind the repository.</small></p></main><script>document.getElementById('reset').onclick=async()=>{const status=document.getElementById('status');status.textContent='Removing old app caches…';try{if('serviceWorker'in navigator){const regs=await navigator.serviceWorker.getRegistrations();await Promise.all(regs.filter(r=>r.scope.includes('/NeonScope/')).map(r=>r.unregister()))}if('caches'in window){const keys=await caches.keys();await Promise.all(keys.filter(k=>k.startsWith('neonscope-')).map(k=>caches.delete(k)))}status.textContent='Cache cleared. Opening NeonScope…';location.replace('./index.html?fresh=20261107v35#support')}catch(e){status.textContent='Update repair failed: '+e.message}}</script></body></html>
